<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{title}}</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body class="login-page"><div class="login-card"><img src="{{url_for('static',filename='images/hustle-nation-logo.svg')}}"><p class="eyebrow">HUSTLE NATION</p><h1>{{title}}</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for cat,msg in messages %}<div class="notice">{{msg}}</div>{% endfor %}{% endwith %}<form method="post"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button class="btn full">Sign in</button></form><a href="{{url_for('home')}}">Back to store</a></div></body></html>
